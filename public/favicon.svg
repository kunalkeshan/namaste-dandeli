<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Namaste Dandeli tab icon.

    Two earlier attempts kept the full ND lockup and both failed at
    16px: the first collapsed into a smudge, the second read as a
    "no entry" strike-through — worse than meaningless for a business.

    A favicon is one glyph at 16px. This is the D alone, drawn in the
    logo's serif with a red hairline on the bowl as the only trace of
    the N's swash. It holds its shape at every size and cannot be
    misread.
  -->
  <rect width="64" height="64" rx="13" fill="#0F3D2E"/>

  <g fill="#FFFFFF">
    <!-- slab serifs, top and bottom -->
    <rect x="13" y="14" width="27" height="5.5"/>
    <rect x="13" y="44.5" width="27" height="5.5"/>
    <!-- stem -->
    <rect x="19" y="14" width="10" height="36"/>
    <!-- bowl: open enough to stay a D when the pixels get coarse -->
    <path d="M29 19.5
             C 44 19.5, 51 24.5, 51 32
             C 51 39.5, 44 44.5, 29 44.5
             L 29 37.5
             C 38 37.5, 42 35.5, 42 32
             C 42 28.5, 38 26.5, 29 26.5
             Z"/>
  </g>

  <!--
    The swash, reduced to a diagonal glimpsed through the counter —
    the same read as the full logo, where the N passes behind the D.
    Clipped to the counter so it never touches the outer silhouette
    and cannot turn the mark into a strike-through at small sizes.
  -->
  <clipPath id="counter">
    <path d="M29 26.5 C 38 26.5, 42 28.5, 42 32 C 42 35.5, 38 37.5, 29 37.5 Z"/>
  </clipPath>
  <path d="M24 40 L 31 22 L 38 24 L 31 42 Z" fill="#E63A2E" clip-path="url(#counter)"/>
</svg>
