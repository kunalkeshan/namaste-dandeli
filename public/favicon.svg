<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1142 1142">
  <!--
    Tab / home-screen icon. Same monogram as src/components/Logo.astro,
    but DELIBERATELY NOT the same paths.

    The D's hairline bowl measures a median 12px out of 1142 — about 1%
    of the mark's width. At a 32px favicon that is a third of a pixel,
    and at 16px it is a sixth: it disappears, and the D reads as a bare
    stem. So the masks are dilated 20px at source scale before tracing,
    which closes the bowl into a legible ring without fusing the
    letterforms (26px fused them; the page logo's 5px is far too light here).

    Regenerate both from the designer's original with:
      node scripts/trace-logo.mjs            # page logo, faithful
      node scripts/trace-logo.mjs --icon     # this file, thickened

    Drawn on the brand green plate so the white D holds against light
    and dark browser chrome. The plate matches theme_color in
    site.webmanifest and the meta tag in Layout.astro — change one and
    you must change all three.

    Two earlier attempts were wrong and both are worth recording:
      1. a lone D with a red mark — lost the N entirely
      2. a D and an N side by side — read "DN", the wrong order, and
         was not the interlocked mark at all
    A third was right in shape but was a hand redraw, not the
    designer's artwork. This is the artwork.
  -->
