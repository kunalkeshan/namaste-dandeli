<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Namaste Dandeli tab icon — the real monogram, not a redraw.
    Same geometry as src/components/Logo.astro, scaled from its
    200x170 viewBox into 64x64 and thickened so it survives 16px.

    Two earlier attempts were wrong and both are worth recording:
      1. a lone D with a red mark — lost the N entirely
      2. a D and an N side by side — read "DN", the wrong order, and
         was not the interlocked mark at all

    The logo is ONE monogram: the N's swash sweeps behind the D and
    its upright stands to the right. That interlock is the mark; two
    separate letters is a different logo.

    Drawn on brand green so the white D holds against light and dark
    browser chrome.
  -->
  <rect width="64" height="64" rx="13" fill="#0F3D2E"/>

  <!--
    Scale: the logo occupies roughly x 20–186, y 33–152 of its
    200x170 box. Mapped to 6–58 / 10–54 here, then every stroke
    widened — the original's hairlines vanish below about 24px.
  -->
  <g transform="translate(2.6,6.2) scale(0.296,0.296)">

    <!-- N, underneath: swash + upright, thickened -->
    <g fill="#E63A2E">
      <path d="M20 36
               C 44 25, 63 40, 87 71
               C 112 103, 138 126, 165 134
               C 174 137, 182 137, 188 135
               L 188 156
               C 176 160, 162 158, 148 153
               C 117 141, 92 112, 68 82
               C 49 58, 38 50, 27 56
               Z"/>
      <rect x="148" y="36" width="20" height="84"/>
      <rect x="133" y="36" width="50" height="11"/>
    </g>

    <!-- D, on top: stem and bowl both heavier than the original -->
    <g fill="#FFFFFF">
      <rect x="30" y="30" width="78" height="13"/>
      <rect x="30" y="126" width="78" height="13"/>
      <rect x="48" y="30" width="30" height="109"/>
      <path d="M78 43
               C 121 43, 145 60, 145 84
               C 145 108, 121 126, 78 126
               L 78 101
               C 107 101, 118 95, 118 84
               C 118 73, 107 67, 78 67
               Z"/>
    </g>
  </g>
</svg>
